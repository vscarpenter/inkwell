<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inkwell Sign-In Sample</title>
  <link rel="stylesheet" href="inkwell.css">
  <link rel="stylesheet" href="demo.css">
</head>
<body>
  <main class="demo-shell">
    <div class="auth-shell">
      <nav class="demo-nav" aria-label="Sample pages">
        <a class="brand" href="index.html">
          <span class="brand-mark" aria-hidden="true">
            <svg width="17" height="17" viewBox="0 0 17 17" fill="none">
              <path d="M5.2 7V5.5a3.3 3.3 0 0 1 6.6 0V7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <path d="M4.2 7h8.6v7H4.2z" stroke="currentColor" stroke-width="1.5"/>
            </svg>
          </span>
          <span class="t-h3">Inkwell</span>
        </a>
        <div class="theme-toggle" aria-label="Theme">
          <button class="btn btn-ghost" type="button" data-theme-choice="auto">Auto</button>
          <button class="btn btn-ghost" type="button" data-theme-choice="light">Light</button>
          <button class="btn btn-ghost" type="button" data-theme-choice="dark">Dark</button>
        </div>
      </nav>

      <section class="card form-grid">
        <div>
          <span class="eyebrow">Auth sample</span>
          <h1 class="t-display">Sign in to Inkwell.</h1>
          <p class="t-small">A compact authentication surface using only existing form, button, link, and badge styles.</p>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input class="input" id="email" type="email" placeholder="you@example.com">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input class="input" id="password" type="password" placeholder="Password">
        </div>
        <label class="checkbox">
          <input type="checkbox" checked>
          Keep me signed in
        </label>
        <button class="btn btn-primary" type="button">Continue</button>
        <p class="t-small">Need access? <a class="link" href="settings.html">Request an invite</a>.</p>
      </section>

      <footer class="page-footer t-small"><a class="link" href="index.html">Back to all examples</a></footer>
      <p class="t-caption" style="text-align: center; margin: 16px 0 24px; font-style: italic; letter-spacing: 0.02em;">
        Made with hairlines and serifs by <a class="link" href="https://vinny.dev">Vinny Carpenter</a>. The 1.5px is on purpose.
      </p>

    </div>
  </main>
  <script src="demo.js"></script>
</body>
</html>
